[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guardloop-sdk"
version = "0.1.0"
description = "Python client for Guardloop, a guardrail and observability layer for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Muzammil Khan" }]
dependencies = [
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/muzammil-kj/guardloop"