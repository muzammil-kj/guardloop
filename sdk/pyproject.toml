[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "guardloop-sdk"
version = "0.1.0"
description = "Python client for Guardloop, a guardrail and observability layer for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muzammil Khan" }]
keywords = ["ai", "agents", "guardrails", "observability", "llm", "human-in-the-loop"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/muzammil-kj/guardloop"
Repository = "https://github.com/muzammil-kj/guardloop"
Issues = "https://github.com/muzammil-kj/guardloop/issues"